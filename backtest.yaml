# Data Configuration
data:
  source: pkl                    # pkl | yahoo
  warmup_years: 2
  stock_data_dir: data/raw/Stock Data
  index_dir: data/raw/Indices
  max_ffill_days: 2

# Backtest Configuration
backtest:
  universes:
    - "nifty50"
    - "niftynext50"
    - "niftymidcap150"
    - "niftysmallcap250"
  periods:
    - start: 2011-01-01
      end: 2015-12-31
    - start: 2016-01-01
      end: 2020-12-31
    - start: 2021-01-01
      end: 2023-12-31
    - start: 2024-01-01
      end: 2026-12-31      
    # - start: 2018-01-01
    #   end: 2022-12-31

    # - start: 2011-01-01
    #   end: 2026-12-31
  initial_cash: 1000000          # 10 Lakhs
  fees: 0.0025                   # 0.25% per trade
  slippage: 0.0
  max_positions: 10
  cash_sharing: true
  build_diagnostics: false
  benchmark: "^NSEI"
  sell_rank_by_universe:
    nifty50: 15
    niftynext50: 20
    niftymidcap150: 20
    niftysmallcap250: 25


# Risk Management
risk:
  stop_loss_pct: null            # e.g., 0.10 for 10%
  take_profit_pct: null          # e.g., 0.20 for 20%
  position_sizing: equal         # equal | volatility | kelly
  volatility_lookback: 21
  max_volatility: null           # e.g., 0.4 for 40%

