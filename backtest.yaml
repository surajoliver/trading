# Optimization
optimization:
  enabled: false
  method: grid_search            # grid_search | optuna | walk_forward
  metric: sharpe                 # sharpe | return | calmar | sortino
  direction: maximize
  n_trials: 100
  n_jobs: 4
  train_years: 3
  test_months: 6
  grid:
    rsi:
      rsi_window: [100, 200, 300]
      buy_threshold: [50, 54, 58]
      sell_threshold: [45, 51, 55]

# Reporting
reporting:
  output_dir: results
  html: false
  excel: false
  pdf: false
  plotly: true
  include_trade_log: false
  include_monthly_returns: false

# Database
database:
  enabled: false
  url: sqlite:///results/backtests.db

# Logging
logging:
  level: INFO
  console_level: WARNING
  file: logs/backtest.log